{% extends 'base.html' %}{% block title %}Reset password{% endblock %}{% block content %}
<section class="form-layout form-layout-login"><div class="form-intro"><div class="eyebrow">Account recovery</div><h1>Reset your<br><em>password.</em></h1><p>We'll send a six-digit reset code to the email address on your account.</p></div><div class="form-card"><h2>Request reset code</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="email">Account email</label><input id="email" name="email" type="email" required autocomplete="email"><button class="button button-full" type="submit">Send reset code</button></form><p class="form-bottom"><a href="{{ url_for('auth.login') }}">Return to sign in</a></p></div></section>{% endblock %}
