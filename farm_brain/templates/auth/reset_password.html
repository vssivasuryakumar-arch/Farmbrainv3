{% extends 'base.html' %}{% block title %}Choose new password{% endblock %}{% block content %}
<section class="form-layout form-layout-login"><div class="form-intro"><div class="eyebrow">Account recovery</div><h1>Create a new<br><em>password.</em></h1><p>Enter the reset code from your email and choose a new password.</p></div><div class="form-card"><h2>New password</h2><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label for="code">Six-digit reset code</label><input id="code" name="code" inputmode="numeric" pattern="[0-9]{6}" minlength="6" maxlength="6" required><label for="password">New password</label><input id="password" name="password" type="password" minlength="10" required autocomplete="new-password"><button class="button button-full" type="submit">Update password</button></form></div></section>{% endblock %}
