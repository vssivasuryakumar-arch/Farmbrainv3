name: Build FARM BRAIN Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'android/**'
      - '.github/workflows/build-android-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    name: Build installable Android debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android platform and build tools
        run: sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
      - name: Build debug APK
        run: gradle --no-daemon --stacktrace -p android :app:assembleDebug
      - name: Verify APK exists and is non-empty
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: farm-brain-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Build summary
        if: success()
        run: |
          echo '## FARM BRAIN APK built successfully' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download **farm-brain-android-debug-apk** from this workflow run.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Extract the artifact and install app-debug.apk on your Android device.' >> "$GITHUB_STEP_SUMMARY"
