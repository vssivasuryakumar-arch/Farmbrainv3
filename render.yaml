# Production-style pilot blueprint. The Starter web service and persistent disk
# are required if private file attachments must survive deployments/restarts.
services:
  - type: web
    name: farm-brain-web
    runtime: python
    region: singapore
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 'farm_brain:create_app()'
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: farm-brain-media
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: farm-brain-db
          property: connectionString
      - key: UPLOAD_FOLDER
        value: /var/data/uploads
      - key: COOKIE_SECURE
        value: "true"
      - key: OTP_DEV_MODE
        value: "false"
      - key: FLASK_DEBUG
        value: "false"
      - key: ADMIN_EMAIL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: SMTP_USE_TLS
        value: "true"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: OGD_API_KEY
        sync: false
      - key: OGD_MANDI_RESOURCE_ID
        sync: false

databases:
  - name: farm-brain-db
    region: singapore
    plan: 0.1c-256mb
    databaseName: farm_brain
    user: farm_brain
